<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Bids AI | Bid Details</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bid-accent {
            color: var(--primary-light);
            font-weight: 700;
        }
        .detail-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .detail-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 16px;
        }
        .tech-pill {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="index.html" class="logo">
                <i class="fas fa-bolt"></i> Nexus Bids AI
            </a>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="dashboard.html">Performance</a>
                <a href="knowledge.html">Knowledge Base</a>
                <a href="analyze.html">Analyze RFP</a>
            </nav>
            <div class="user-action">
                <button id="theme-toggle" class="theme-toggle"></button>
            </div>
        </div>
    </header>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <a href="index.html" style="color: var(--text-muted); text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
            <button id="export-btn" style="background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; display: none; font-weight: 600;">
                <i class="fas fa-file-word"></i> Export to Word
            </button>
        </div>

        <div id="bid-content" class="animate-fadeIn">
            <!-- Content will be injected via JS -->
            <div style="text-align: center; padding: 5rem;">
                <i class="fas fa-circle-notch fa-spin fa-3x"></i>
                <p style="margin-top: 1rem;">Retrieving detailed bid intelligence...</p>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bidId = urlParams.get('id');
            if (bidId) {
                window.loadBidDetails(bidId);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
